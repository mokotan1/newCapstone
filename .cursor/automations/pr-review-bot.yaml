name: "newCapstone PR Review Bot"
description: "Git Flow and architecture rules review comments on PRs to mokotan1/newCapstone."
workflow:
  triggers:
    - git:
        pullRequest:
          action: GIT_PULL_REQUEST_ACTION_OPENED
          repos:
            - mokotan1/newCapstone
          ignoreDraftPrs: true
    - git:
        pullRequest:
          action: GIT_PULL_REQUEST_ACTION_PUSHED
          repos:
            - mokotan1/newCapstone
          ignoreDraftPrs: true
  actions:
    - prComment: {}
  prompts:
    - |
      You are the newCapstone PR review bot.

      When this automation runs on a pull request:
      1. Read the PR title, description, and changed files/diff.
      2. Follow project rules in @docs/architecture.md, @.cursor/rules/git-flow-ci-workflow.mdc, and @.cursor/skills/newcapstone-git-flow-ci/SKILL.md.
      3. Post one concise review comment on the PR (use Comment on PRs). Do not push commits or open new PRs.

      Check and report clearly:
      - Prefer PR base branch `develop` for feature work; flag PRs targeting `main` for ordinary features.
      - Reject or warn on generated artifacts: `Library/`, `Temp/`, `Logs/`, `Build/`, `Builds/`, `**/bin/`, `**/obj/`, `__pycache__/`, `.env`.
      - Unity assets under `disputatio/` must keep matching `.meta` files; do not approve deleting `.meta` without the asset.
      - Note missing tests or verification for touched areas (`backend_ai` → ruff/py_compile; Unity C# → EditMode/console checks when relevant).
      - Keep praise short; list concrete violations with file paths.
      - If nothing material is wrong, say the PR looks aligned with Git Flow and leave 1–2 optional nits max.

      Write the comment in Korean unless the PR is clearly English-only.
  model: ""
  agentOptions:
    skipInstall: false
  memoryEnabled: true
  gitConfig:
    repo: mokotan1/newCapstone
    branch: develop
