# Production stack: GHCR backend + Caddy HTTPS.
# Copy to server as /opt/newcapstone/docker-compose.yml (same directory as .env).
# REQUIRED in .env: GROQ_API_KEY, GOOGLE_API_KEY, IMAGE_TAG (commit SHA preferred).

services:
  backend:
    image: ghcr.io/mokotan1/newcapstone-ai:${IMAGE_TAG}
    container_name: newcapstone-backend
    restart: unless-stopped
    env_file:
      - .env
    # Loopback-only: host scripts (postdeploy) can curl localhost:8000; not exposed publicly.
    ports:
      - "127.0.0.1:8000:8000"
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/', timeout=5).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - web

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web
    depends_on:
      - backend

volumes:
  caddy_data: {}
  caddy_config: {}

networks:
  web:
    driver: bridge
