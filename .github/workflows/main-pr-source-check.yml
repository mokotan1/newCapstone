name: Main PR source check

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited

permissions:
  contents: read

jobs:
  require-develop-source:
    name: Require PR from develop
    runs-on: ubuntu-latest
    steps:
      - name: Validate source branch
        shell: bash
        run: |
          if [ "${{ github.head_ref }}" != "develop" ]; then
            echo "Pull requests into main must come from develop."
            echo "Current source branch: ${{ github.head_ref }}"
            exit 1
          fi

          echo "Source branch is develop."
